<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>A form that rebuilds itself from the resume</title></head>
<body>
<!--
  UKG/UltiPro reads the resume you upload and fills Work Experience and
  Education from the parse, re-rendering both sections. On the USP application
  the agent uploaded at 55.7s and clicked "Add Experience" at 56.3s - six
  tenths of a second later, into a section the site had not finished building.
  The panel that opened never completed: its foreground overlay stayed up, the
  panel itself collapsed to 0x0, and the page was unusable for the candidate
  as much as for the agent.

  This is that, minus the overlay (which foreground_check owns): upload, a
  pause while the "parse" runs, then the section is replaced wholesale. Acting
  before it settles means acting on nodes that are about to be thrown away.
-->
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; }
  #experience { border: 1px solid #ccc; padding: 12px; margin-top: 16px; }
</style>

<h1>Apply - USP</h1>
<label>Upload Resume
  <input id="resume" type="file" accept=".doc,.docx,.pdf"></label>

<div id="experience">
  <h2>Work Experience</h2>
  <button id="add" type="button" onclick="addEntry()">Add Experience</button>
  <div id="entries"></div>
</div>

<pre id="log"></pre>

<script>
  var parsing = false;

  function addEntry() {
    // What the site does with a click that lands mid-parse: it is accepted,
    // and then thrown away by the rebuild a moment later. The agent sees
    // "Clicked Add Experience" and a section that no longer holds it.
    var d = document.createElement('div');
    d.className = 'entry';
    d.innerHTML = '<label>Job Title <input class="title" type="text"></label>';
    document.getElementById('entries').appendChild(d);
    document.getElementById('log').textContent += (parsing ? 'add-during-parse ' : 'add ');
  }

  // With ?manual the parse never starts on its own, and the test says when.
  // Timers race the poll loop: under a full sweep this machine runs a dozen
  // browsers, wait_quiet's polling stretches, and a parse on a 1.8s timer can
  // finish before it returns - so "the parse had not begun" stopped being
  // true and the check failed for a reason that had nothing to do with the
  // code. A parse that cannot start until it is called cannot race anything.
  var manual = location.search.indexOf('manual') >= 0;

  function startParse() {
    parsing = true;
    document.getElementById('entries').innerHTML =
      '<div class="entry"><label>Job Title <input class="title" type="text" value="Parsing..."></label></div>';
    setTimeout(function () {
      document.getElementById('entries').innerHTML =
        '<div class="entry"><label>Job Title <input class="title" type="text" value="Software Engineer"></label></div>' +
        '<div class="entry"><label>Job Title <input class="title" type="text" value="Software Engineer Intern"></label></div>';
      parsing = false;
      document.getElementById('log').textContent += 'parsed ';
    }, 1000);
  }

  document.getElementById('resume').addEventListener('change', function () {
    document.getElementById('log').textContent += 'upload ';
    if (manual) return;
    parsing = true;
    // Two beats, like a real parse: the section grows, then is replaced.
    // Nothing happens for a while. This is the part that caught me: a parse
    // that has not begun looks exactly like a page that has finished, so
    // waiting for "quiet" alone returns before the site has touched anything.
    setTimeout(function () {
      document.getElementById('entries').innerHTML =
        '<div class="entry"><label>Job Title <input class="title" type="text" value="Parsing..."></label></div>';
    }, 1800);
    setTimeout(function () {
      document.getElementById('entries').innerHTML =
        '<div class="entry"><label>Job Title <input class="title" type="text" value="Software Engineer"></label></div>' +
        '<div class="entry"><label>Job Title <input class="title" type="text" value="Software Engineer Intern"></label></div>';
      parsing = false;
      document.getElementById('log').textContent += 'parsed ';
    }, 2800);
  });
</script>
</body>
</html>
