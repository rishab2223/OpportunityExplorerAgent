<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Redrawn radio</title></head>
<body>
<!-- A Yes / No question whose whole group is rebuilt the first time anything
     in it is pressed - what LinkedIn's Easy Apply did on Axionix (Oct 2026):
     the radio the agent was ticking was gone before it could be read back. -->
<form id="f">
  <fieldset id="q"><legend>Are you comfortable working from the office?</legend><div id="opts"></div></fieldset>
</form>
<script>
let rebuilt = false;
function draw() {
  document.getElementById('opts').innerHTML =
    '<label><input type="radio" name="office" value="Yes" id="y' + (rebuilt ? '2' : '1') + '"> Yes</label>' +
    '<label><input type="radio" name="office" value="No" id="n' + (rebuilt ? '2' : '1') + '"> No</label>';
}
draw();
document.getElementById('q').addEventListener('mousedown', () => { if (!rebuilt) { rebuilt = true; draw(); } }, true);
document.getElementById('q').addEventListener('keydown', () => { if (!rebuilt) { rebuilt = true; draw(); } }, true);
document.getElementById('q').addEventListener('click', (e) => {
  if (!rebuilt) { e.preventDefault(); rebuilt = true; draw(); }
}, true);
</script>
</body>
</html>
