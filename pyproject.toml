[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-explorer-agent"
version = "0.1.0"
description = "Opportunity Explorer Agent: scrape, score, enrich matches, dump JSON"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "apify-client>=1.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "playwright>=1.40.0",
]

[project.scripts]
opportunity-explorer = "src.cli:main"
opportunity-explorer-web = "src.web.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]
