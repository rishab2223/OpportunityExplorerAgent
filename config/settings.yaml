# Scores are out of 100: skills 35, experience 20, role 15, stack 10, company 10,
# location 10. Enrich (tailored resume) runs only when score >= min_score.
# A value of 1-10 is read as the old 1-10 scale (7 means 70).
min_score: 70
# Jobs up to this many points under min_score are scored again by
# openai.second_look_model, and kept if either look reaches the bar. 0 = off.
second_look_below: 10

# If true, Indeed or LinkedIn scrape errors fail the whole scrape step.
strict_sources: false

# Compile each tailored .tex to a .pdf during the run. Needs latexmk or pdflatex
# on PATH; when it fails the run still succeeds and records resume_pdf_error.
compile_pdf: true
# Resumes compiled side by side (1-16). One at a time took ~10 min for 117.
pdf_concurrency: 6

# run:       interview prep is written with every tailored resume (most of the
#            tailoring call's time: ~60% of what it writes).
# on_demand: written only for a job you open (Job info > Write interview prep).
interview_prep: on_demand
# Reuse a score or tailored resume an earlier run already made for the same
# posting, resume and model, instead of calling the model again.
reuse_enrichment: true

# Cross-run job history (localData/job_history.db). Jobs you applied to are
# dropped right after scrape on later runs; delete the file to reset.
history:
  skip_applied: true    # drop jobs already applied to
  skip_skipped: false   # skipped jobs come back next run
  skip_referral: true   # jobs with a referral pending/sent stay out until cleared as failed
  skip_closed: true     # jobs no longer accepting applications never come back
  match_similar: true   # also match by company+title when the site reissued its id

# Drop jobs whose stated minimum experience is above yours, right after scrape
# (before any scoring call). Your years come from total_experience_years in
# your profile (user menu > Profile); the filter does nothing while it is empty.
# Only the general requirement counts ("8+ years of software engineering
# experience"), not skill lines ("3+ years of Kafka"); a posting that states
# none is kept.
experience:
  enabled: true
  tolerance_years: 1    # how far above your years a job may ask. 0 = strict; 1 at 6 years keeps 7+, drops 8+
  # drop:   jobs over the limit are removed before scoring; you never see them.
  # review: they are scored anyway (one cheap call each); those scoring
  #         review_min_score or more appear in the Held back tab, strongest
  #         first, at most review_max per run. Required once enabled.
  mode: review
  # The same bar as the shortlist (out of 100): at 9 of 10, a run that held 36
  # jobs showed none (9 of 266 jobs scored 9 at all).
  review_min_score: 70
  review_max: 10

# Which LLM writes the tailored resume + interview prep: openai | claude.
# Scoring always uses openai.score_model (cheap, one call per scraped job).
enrich_provider: claude
# Which LLM drives assisted apply (one decision per form step): openai | claude.
apply_provider: claude

claude:
  # agent-sdk: runs the bundled Claude Code binary with your Claude login (Max/Pro); no API key.
  # api:       Anthropic Messages API with ANTHROPIC_API_KEY (pay-as-you-go).
  backend: agent-sdk
  # claude-opus-5 (recommended) | claude-fable-5 (strongest, heaviest on usage limits) | claude-sonnet-5
  enrich_model: claude-opus-5
  # low | medium | high | xhigh | max. Thinking depth; medium is plenty for resume edits.
  effort: medium
  # Assisted apply: per-step form decisions. low keeps each step fast.
  apply_model: claude-opus-5
  apply_effort: low
  # When a dropdown does not list the profile's answer word for word, one
  # call per page picks the nearest honest option (Fluent -> Advanced).
  # "sonnet" is Claude Code's alias for the current Sonnet.
  pick_model: sonnet
  pick_effort: medium
  # At the end of each step, one call labels the buttons (next / final / opens
  # / other) while you wait to review it. Sonnet at low effort: ~4 s.
  buttons_model: sonnet
  buttons_effort: low

openai:
  # gpt-5.6-luna (cheaper) | gpt-5.6-sol (stronger, better structured LaTeX) | gpt-5.6-terra
  score_model: gpt-5.6-luna
  # Only used when enrich_provider is openai.
  enrich_model: gpt-5.6-sol
  # Only used when apply_provider is openai.
  apply_model: gpt-5.6-luna
  # Parallel LLM calls. Scoring calls are short; enrichment calls are long.
  # enrich_concurrency is used for Claude too (each agent-sdk call is its own
  # process; lower it if your Claude plan starts refusing calls).
  score_concurrency: 16
  enrich_concurrency: 8

resume:
  # Local file only. .tex writes tailored resumes; .pdf writes JSON only.
  # Relative to the project root. Empty string fails load.
  local_path: "localData/resume.tex"

scrape:
  # Indeed `keyword` only. LinkedIn search text is the keywords= query in searchUrls below.
  keywords: "title:(\"Software Engineer\" or \"Software Developer\" or \"Senior Software Engineer\" or \"Senior Software Developer\" or \"NodeJS\")"
  # Indeed `country` (India → IN). LinkedIn location is the geoId in searchUrls below.
  location: "India"
  # One lookback for every source: Indeed fromDays, LinkedIn f_TPR (injected into
  # each searchUrls entry at run time), plus a local posted_at filter.
  # 24h | 3d | 7d
  posted_within: "3d"
  max_detail_jobs: 150   # per source; the run settings popup can set each source on its own
  exclude_keywords: []
  sources:
    - indeed
    - linkedin
  apify:
    # https://console.apify.com/actors/BIeK7ZcYUrdxDgOEQ
    indeed_actor: "BIeK7ZcYUrdxDgOEQ"
    # https://console.apify.com/actors/d1gs0RHIwEnsan7XX
    linkedin_actor: "d1gs0RHIwEnsan7XX"
    # indeed_input / linkedin_input override the working defaults in
    # src/scrape/apify_jobs.py; only set what you want to change.
    linkedin_input:
      # Overrides the actor's keyword/filter fields. Search text and location
      # (geoId=102713980 = India) live in the URL; the recency window (f_TPR)
      # is injected from scrape.posted_within at run time. sortBy=DD = newest first.
      searchUrls:
        - "https://www.linkedin.com/jobs/search/?keywords=software%20engineer%20OR%20software%20developer%20OR%20nodejs%20OR%20backend%20engineer&geoId=102713980&sortBy=DD"
